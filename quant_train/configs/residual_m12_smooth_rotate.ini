[paths]
sr_root = /mnt/e/tensorrt/tensorRT/models/SR
weights = /mnt/e/tensorrt/tensorRT/models/SR/swinir/weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth
data_root = /mnt/e/数据集/Flickr2K/Flickr2K
output_dir = /mnt/e/tensorrt/tensorRT_10/swinir-trt/quant_train/outputs_residual_m12_smooth_rotate
quant_params =

[model]
scale = 4
window_size = 8
embed_dim = 180
depths = 6,6,6,6,6,6
num_heads = 6,6,6,6,6,6
mlp_ratio = 2
upsampler = pixelshuffle
resi_connection = 1conv
img_size = 64
img_range = 1.0

[quant]
w_bits = 8
a_bits = 8
weight_symmetric = true
act_symmetric = false
per_channel_weight = true
quantize_weight = true
quantize_input = true
quantize_output = false
fp32_ops = softmax,layer_norm
observer = minmax
qmin = -128
qmax = 127
act_backend = fakequant_out
min_scale = 1e-9
softmax_mode = default
skip_attn_act = false
skip_residual_act = false
residual_fix = smooth_rotate
smooth_alpha = 0.5
rotate_seed = 0

[search]
enable = true
method = dobi
dobi_k = 100
percentiles = 99.0,99.5,99.9,99.95,99.99,100
max_samples = 50000

[data]
calib_num = 60
eval_num = 8
patch_size = 64
eval_patch_size = 64
crop = random
batch_size = 1
num_workers = 0

[partition]
grain = network
block_type = swin_block

[train]
iters = 1
act_scale_iters = 1
lr = 1e-3
act_lr = 1e-2
optimizer = adam
seed = 0
device = cuda
learn_act_scale = false
adaround = false
src = false
src_reg = 1e-3
src_laplacian = true
src_grain = layer
log_interval = 50

[loss]
recon = mse
image = l1
image_target = fp32
lambda_recon = 1.0
lambda_img = 0.0
lambda_feat = 1.0
lambda_reg = 0.01
dqc = true
adaround_beta_start = 20
adaround_beta_end = 2
adaround_warmup = 0.2
fisher = false
fisher_target = hr

[eval]
save_images = false

[deploy]
save_path = ${paths:output_dir}/swinir_w8a8_quant.json
weights_path = ${paths:output_dir}/swinir_w8a8_folded.pth
range_dir = ${paths:output_dir}/ranges
export_ranges = false
hist_bins = 64
format = json
skip_calib_if_loaded = true
skip_train_if_loaded = true
export_stats = true
stat_dir = ${paths:output_dir}/stats
stat_image =
